<script>
'use strict';
const assets=JSON.parse(document.getElementById('assets').textContent),sources=JSON.parse(document.getElementById('sources').textContent);
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=name=>assets[name]?`<img class="icon" src="${assets[name]}" alt="">`:'';
const btn=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${/^<img[^>]*>$/.test(label)?'aria-label="'+({'file':'Открыть действия с файлом','resend':'Повторить отправку','logs':'Открыть папку журналов','choose-avest':'Выбрать утилиту подписания','choose-download':'Выбрать папку загрузки'}[action.split(':')[0]]||'Действие')+'"':''} ${disabled?'disabled':''}>${label}</button>`;
const stateNames={READY_FOR_DOWNLOAD:'К загрузке',DOWNLOADING:'Загрузка',READY_FOR_SIGNING:'К подписанию',SIGNED:'Подписан',PARTIALLY_SIGNED:'Подписан частично',DECLINED:'Отклонен',EXPIRED:'Просрочен',DOWNLOAD_ERROR:'Ошибка загрузки',SIGN_ERROR:'Ошибка подписания',SIGN_CANCELLED:'Отмена пользователем',SENT:'Отправлен',SEND_ERROR:'Ошибка отправки'};
const description={READY_FOR_SIGNING:'Все файлы скачаны, ни один не подписан',SIGNED:'Все файлы подписаны',PARTIALLY_SIGNED:'Подписаны не все файлы',DECLINED:'Пользователь отклонил подписание',DOWNLOAD_ERROR:'Ошибка создания структуры или скачивания файлов',SIGN_ERROR:'Ошибка подписания или отправки файлов',SIGN_CANCELLED:'Пользователь отменил подписание'};
const statusLabel=(label,tone)=>`<span class="status ${esc(tone)}">${esc(label)}</span>`;
const status=s=>statusLabel(stateNames[s]||s,['SIGNED','SENT'].includes(s)?'good':s.endsWith('ERROR')?'error':s==='READY_FOR_SIGNING'?'ready':['DECLINED','EXPIRED','SIGN_CANCELLED'].includes(s)?'gray':'warning');
const certs=[{id:'cert1',name:'Демонстрационный пользователь',org:'Тестовая организация',serial:'DEMO-01-2026',issuer:'УЦ Банка (демо)',from:'01.10.2026',until:'01.10.2027',valid:true},{id:'cert2',name:'Демонстрационный пользователь',org:'Тестовая организация',serial:'DEMO-02-2025',issuer:'НЦЭУ (демо)',from:'01.09.2025',until:'01.09.2026',valid:false}];
let tasks=[],page='tasks',opened=null,fileSelection=new Set(),selectedTasks=new Set(),selectedCert=null,noticeTimer,dialogResolve=null,dialogDismissible=true,busy=false;
const initialSettings={avest:'C:\\Program Files\\Avest\\AvCmUt4\\AvCmUt4.exe',download:'C:\\Users\\demo.user\\Downloads',archive:3,remove:15,journal:30};
let settings={...initialSettings},session={start:0,last:0,saved:false,cert:null},pendingUpdate=false,updateVersion='1.0.0-demo';
const errorTask=t=>['DOWNLOAD_ERROR','SIGN_ERROR'].includes(t.status);
const eligible=t=>t.active&&!errorTask(t)&&t.status==='READY_FOR_SIGNING'&&!t.processing;
const declineAllowed=t=>t.active&&!errorTask(t)&&['READY_FOR_DOWNLOAD','DOWNLOADING','READY_FOR_SIGNING'].includes(t.status)&&!t.processing;
const selectedIds=t=>t.selected??t.files.map(f=>f.id);
const stamp=()=>new Date().toLocaleString('ru-RU',{timeZone:'Europe/Minsk'}).replace(',','');
// Проектное дополнение прототипа. Все записи относятся только к демонстрационным данным.
const journalKinds={received:'Получение задачи',download:'Загрузка файла',sign:'Формирование P7S',send:'Передача P7S',archive:'Перенос в архив',decline:'Отклонение задачи',delete:'Удаление из архива',certificate:'Выбор сертификата',settings:'Сохранение настроек',refresh:'Обновление списка'};
const journalResults={success:'Успешно',error:'Ошибка',cancel:'Отменено',none:'—'};
const journalEmptyFilters=()=>({query:'',kind:'',result:'',source:'',from:'',to:''});
let operationLog=[],journalSequence=0,journalFilters=journalEmptyFilters(),journalNewestFirst=true;
function journalTimestamp(value){
 if(!value)return new Date().toISOString();
 if(/^\d{2}\.\d{2}\.\d{4}/.test(value)){const [day,month,year,hour,minute]=value.match(/\d+/g);return new Date(`${year}-${month}-${day}T${hour}:${minute}:00+03:00`).toISOString()}
 return new Date(value).toISOString();
}
function journalDateLabel(value){return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(value)).replace(',','')}
function addOperation({kind,result='none',task=null,file=null,message='',details='',at=null}){
 const entry={id:'LOG-'+String(++journalSequence).padStart(4,'0'),at:journalTimestamp(at),kind,result,taskId:task?.id||'',taskName:task?.name||'',source:task?.system||'',fileId:file?.id||'',fileName:file?.name||'',message,details};
 operationLog.push(entry);return entry;
}
function seedJournal(){
 operationLog=[];journalSequence=0;journalFilters=journalEmptyFilters();journalNewestFirst=true;
 for(const t of tasks){
  const start=new Date(journalTimestamp(t.received||t.date)).getTime(),at=seconds=>new Date(start+seconds*1000).toISOString();
  addOperation({kind:'received',result:'success',task:t,message:'Получен комплект документов для подписания',details:'В задаче файлов: '+t.files.length,at:at(0)});
  t.files.forEach((f,i)=>{
   const failed=f.status==='DOWNLOAD_ERROR';
   addOperation({kind:'download',result:failed?'error':'success',task:t,file:f,message:failed?(f.error||'Файл не загружен'):'Исходный файл получен и сохранён',details:failed?'Задача доступна для просмотра результатов загрузки.':'Файл доступен в карточке задачи.',at:at(8+i)});
   if(['SENT','SEND_ERROR','SIGNED'].includes(f.status)){
    addOperation({kind:'sign',result:'success',task:t,file:f,message:'Сформирован отдельный P7S',at:at(35+i)});
    if(f.status!=='SIGNED')addOperation({kind:'send',result:f.status==='SENT'?'success':'error',task:t,file:f,message:f.status==='SENT'?'Получено подтверждение передачи P7S':(f.error||'P7S не передан'),at:at(45+i)});
   }
  });
  if(t.status==='SIGN_CANCELLED')addOperation({kind:'sign',result:'cancel',task:t,message:'Пользователь отменил подписание',at:at(35)});
  if(t.status==='DECLINED')addOperation({kind:'decline',result:'success',task:t,message:'Пользователь отклонил задачу',at:t.completed||at(60)});
  if(!t.active)addOperation({kind:'archive',result:'success',task:t,message:'Карточка и результаты доступны в архиве',at:t.completed||at(60)});
 }
}
function journalRangeError(){return journalFilters.from&&journalFilters.to&&journalFilters.from>journalFilters.to?'Начало периода не может быть позже его окончания.':''}
function filteredOperations(){
 if(journalRangeError())return [];
 const query=journalFilters.query.trim().toLocaleLowerCase('ru-RU');
 const from=journalFilters.from?new Date(journalFilters.from+'T00:00:00+03:00').getTime():-Infinity;
 const to=journalFilters.to?new Date(journalFilters.to+'T23:59:59.999+03:00').getTime():Infinity;
 return operationLog.filter(e=>{
  const time=new Date(e.at).getTime();
  return (!journalFilters.kind||e.kind===journalFilters.kind)&&(!journalFilters.result||e.result===journalFilters.result)&&(!journalFilters.source||e.source===journalFilters.source)&&time>=from&&time<=to&&(!query||[e.taskId,e.taskName,e.fileName,e.message,e.details,journalKinds[e.kind],journalResults[e.result]].join(' ').toLocaleLowerCase('ru-RU').includes(query));

 const answer=await showDialog('Ввод пароля контейнера','<p>Решение по документу и замечание задаются в ГЭДК.</p><p class="demo-note">Имитация ввода пароля. Не вводите настоящий пароль.</p><label>Пароль контейнера (демонстрация)<input type="password" value="demo" readonly aria-label="Демонстрационный пароль"></label><label><input id="remember-demo-password" type="checkbox"> Использовать пароль в пределах сессии</label>',[{label:'Отмена',value:false},{label:'Подтвердить демонстрационный ввод',value:true,cls:'primary'}]);
 if(!answer){addOperation({kind:'sign',result:'cancel',task:t,message:'Отменён ввод пароля'});return false}
 if(outcome==='passwordempty'||outcome==='passworderror'){await info('Ошибка пароля',outcome==='passwordempty'?'Введите пароль от контейнера ключа.':'Неверный пароль контейнера ключа. Значение очищено; можно повторить подготовку.');session.saved=false;return false}
 const now=Date.now();session={start:session.start||now,last:now,saved:$('#remember-demo-password')?.checked??false,cert:selectedCert||'external'};return true;
}
async function signing(queue){
 let done=0,errors=0,expired=0,stopped=false;busy=true;
 try{
 for(const [taskIndex,t] of queue.entries()){
  if(session.start&&Date.now()-session.start>=4*3600000){endSession('Истекли 4 часа');stopped=true;break}
  if(Date.now()-t.activatedAt>=settings.archive*86400000){expireTask(t);expired++;continue}
  if(!eligible(t))continue;const pending=t.files.filter(f=>selectedIds(t).includes(f.id));if(!pending.length){await info('Выбор файлов','Выберите хотя бы один файл для подписания');stopped=true;break}
  if(pending.length<t.files.length&&!await confirmAction('Частичное подписание','Остальные файлы останутся неподписанными. Продолжить?')){stopped=true;break}
  if(!await prepareTask(t)){stopped=true;break}
  if(Date.now()-t.activatedAt>=settings.archive*86400000){expireTask(t);expired++;continue}
  if(session.start&&Date.now()-session.start>=4*3600000){endSession('Истекли 4 часа');stopped=true;break}
  if($('#demo-update-during')?.checked&&!pendingUpdate){await requestUpdate()}
  t.processing=true;const rawOutcome=$('#outcome').value,outcome=taskIndex>0&&['signerror','senderror'].includes(rawOutcome)?'success':rawOutcome;
  showDialog('Подписание...','<p>'+esc(t.name)+'</p><div class="progress"><i></i></div><p>Имитация формирования и передачи P7S.</p>',[],false);
  await new Promise(resolve=>setTimeout(resolve,350));dialogDismissible=true;closeDialog();
  if(outcome==='cancel'){t.processing=false;addOperation({kind:'sign',result:'cancel',task:t,message:'Подготовка отменена пользователем'});stopped=true;break}
  if(outcome==='signerror'){t.status='SIGN_ERROR';t.error='Ошибка формирования P7S (демонстрация)';pending.forEach(f=>{f.status='SIGN_ERROR';f.formation='Ошибка формирования';f.error=t.error;addOperation({kind:'sign',result:'error',task:t,file:f,message:f.error})});errors++}
  else{pending.forEach(f=>{f.formation='P7S сформирован';f.delivery=outcome==='senderror'?'Ошибка передачи':'Передача подтверждена';f.status=outcome==='senderror'?'SEND_ERROR':'SENT';f.error=outcome==='senderror'?'Ошибка передачи P7S (демонстрация)':'';addOperation({kind:'sign',result:'success',task:t,file:f,message:'P7S сформирован'});addOperation({kind:'send',result:outcome==='senderror'?'error':'success',task:t,file:f,message:f.error||'Передача P7S подтверждена'})});if(outcome==='senderror'){t.status='SIGN_ERROR';t.error='Ошибка передачи P7S';errors++}else{t.status=pending.length===t.files.length?'SIGNED':'PARTIALLY_SIGNED';t.active=false;t.archivedAt=Date.now();t.completed=stamp();t.error='';addOperation({kind:'archive',result:'success',task:t,message:'Задача перемещена в архив'});done++}}
  t.processing=false;session.last=Date.now();
 }
 }finally{busy=false;for(const t of tasks)t.processing=false;opened=null;selectedTasks.clear();if(sessionExpired())endSession();render()}
 await info('Результат подписания',`Успешно: ${done}. Ошибки: ${errors}. Просрочено: ${expired}. Не начато: ${queue.filter(t=>t.active&&!errorTask(t)).length}.${stopped?' Пакет остановлен.':''}`);
 if(pendingUpdate)await installUpdate();
}
async function declineSelected(ids=[...selectedTasks]){const selected=tasks.filter(t=>ids.includes(t.id));if(!selected.length)return info('Отклонение задач','Выберите хотя бы одну задачу для отклонения.');if(selected.some(t=>!declineAllowed(t)))return info('Отклонение недоступно','Задачи с итоговой ошибкой и завершённые задачи отклонять нельзя.');if(!await confirmAction('Отклонение задач',`Отклонить выбранные задачи (${selected.length}) и переместить их в архив?`,'Отклонить'))return;let failed=0;for(const t of selected){try{t.status='DECLINED';t.error='Пользователь отклонил подписание';t.active=false;t.archivedAt=Date.now();t.completed=stamp();addOperation({kind:'decline',result:'success',task:t,message:'Задача отклонена'});addOperation({kind:'archive',result:'success',task:t,message:'Задача перемещена в архив'})}catch{failed++}}opened=null;selectedTasks.clear();render();if(failed)await info('Ошибка отклонения',`Не удалось отклонить: ${failed} из ${selected.length}.`)}
async function remove(ids){if(!ids.length)return info('Удаление','Выберите архивные задачи.');if(!await confirmAction('Удаление задачи','Удалить выбранные архивные задачи и связанные демонстрационные файлы?','Удалить'))return;tasks.filter(t=>!t.active&&ids.includes(t.id)).forEach(t=>addOperation({kind:'delete',result:'success',task:t,message:'Архивная задача удалена'}));tasks=tasks.filter(t=>t.active||!ids.includes(t.id));opened=null;selectedTasks.clear();render()}
async function requestUpdate(){const yes=await confirmAction('Доступно обновление','Доступна демонстрационная версия 1.0.1. Установить обновление?','Установить');if(!yes)return;pendingUpdate=true;if(busy){notify('Обновление будет установлено после окончания обработки пакета.');return}await installUpdate()}
async function installUpdate(){pendingUpdate=false;const result=$('#demo-update-result')?.value||'success';if(result!=='success'){await info('Обновление не установлено',result==='older'?'Понижение версии запрещено.':result==='untrusted'?'Проверка источника, подписи или целостности не пройдена.':'Ошибка до замены версии. Работа с прежней версией продолжается.');return}endSession('Обновление установлено в демонстрации');updateVersion='1.0.1-demo';render();await info('Обновление завершено','Демонстрационная установка завершена. Выбор сертификата сохранён; при подписании потребуется новый ввод пароля.')}
async function dispatch(action){
 const [kind,id,fileId]=action.split(':');if(busy&&kind!=='update')return;
 if(kind==='journal-detail')await showJournalEntry(id);
 else if(kind==='journal-reset'){journalFilters=journalEmptyFilters();render()}
 else if(kind==='journal-refresh'){cleanupRetention();updateJournalResults();notify('Журнал обновлён')}
 else if(kind==='open'){opened=id;render()}
 else if(kind==='back'){opened=null;render()}
 else if(kind==='refresh'){cleanupRetention();render()}
 else if(kind==='sign-selected'){const q=tasks.filter(t=>selectedTasks.has(t.id)&&eligible(t));if(q.length)await signing(q)}
 else if(kind==='sign-card'){const t=tasks.find(t=>t.id===opened);if(t&&eligible(t))await signing([t])}
 else if(kind==='decline-selected')await declineSelected();
 else if(kind==='decline')await declineSelected([id]);
 else if(kind==='delete')await remove([id]);
 else if(kind==='delete-selected')await remove([...selectedTasks]);
 else if(kind==='export'||kind==='export-all'){const t=tasks.find(t=>t.id===id),files=t.files.filter(f=>f.status!=='DOWNLOAD_ERROR'&&(kind==='export-all'||f.id===fileId));await info('Сохранение копий исходных файлов',`Демонстрация копирования: ${files.length} файлов в ${settings.download}. Рабочие файлы не перемещаются. Реальные файлы в прототип не загружены.`)}
 else if(kind==='cert-use'){const c=certs.find(c=>c.id===id);if(!c?.valid)return;selectedCert=id;persistCertificate();endSession('Сертификат выбран');addOperation({kind:'certificate',result:'success',message:'Выбран сертификат по умолчанию'});render()}
 else if(kind==='cert-reset'){selectedCert=null;persistCertificate();endSession('Выбор сертификата сброшен');addOperation({kind:'certificate',result:'success',message:'Выбор сертификата сброшен'});render()}
 else if(kind==='cert-view'){const c=certs.find(c=>c.id===id);await info('Сведения о сертификате',`${c.name}. ${c.issuer}. Действителен до ${c.until}. Иллюстрация системного окна Windows.`)}
 else if(kind==='choose-avest'||kind==='choose-download')await info('Выбор пути','В приложении используется системный диалог. В демонстрации измените путь в поле настроек.');
 else if(kind==='logs')await info('Каталог журналов','В приложении открывается каталог журналов. Действие имитируется.');
 else if(kind==='update')await requestUpdate();
}
function about(){showDialog('Об этом прототипе','<p>Целевое поведение по согласованным требованиям. Оформление основано на снимке develop 1383ab46.</p><p>Данные вымышлены. Криптография, передача, копирование файлов, обновление и системные диалоги имитируются. Пароли не запрашиваются; в памяти сессии хранится только демонстрационный признак подтверждения.</p><p>Выбор сертификата сохраняется в браузере; настройки и журнал сбрасываются при перезагрузке. Выбор файлов внутри задачи сохраняется при переходах. Новые сценарии доступны в панели «Сценарии».</p>')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('#dialog-x').onclick=()=>closeDialog();$('#dialog').addEventListener('cancel',e=>{e.preventDefault();if(dialogDismissible)closeDialog()});
$('#avatar').src=assets.avatar;$('#update-certs').textContent='Обновить СОС и УЦ';$('#update-certs').onclick=()=>{addOperation({kind:'certificate',result:'success',message:'СОС и сертификаты УЦ обновлены (демонстрация)'});info('Обновление СОС и УЦ','Демонстрация обновления завершена.')};$('#about').onclick=about;
$('#version').onclick=()=>requestUpdate();$('#toggle-demo').onclick=()=>{$('#demo-controls').hidden=!$('#demo-controls').hidden;$('#toggle-demo').setAttribute('aria-expanded',String(!$('#demo-controls').hidden))};
$('#dataset').onchange=e=>seed(e.target.value);$('#reset').onclick=()=>seed($('#dataset').value);
$('#demo-expire-session').onclick=()=>{if(session.start)session.start=Date.now()-4*3600000;else notify('Сначала начните сессию подписания.');if(!busy&&sessionExpired()){endSession('Истекли 4 часа');render()}};
$('#demo-idle-session').onclick=()=>{if(session.start){session.last=Date.now()-15*60000;if(!busy){endSession('15 минут бездействия');render()}}else notify('Сначала начните сессию подписания.')};
$('#demo-cleanup').onclick=()=>{cleanupRetention();render()};
document.addEventListener('pointerdown',()=>{if(session.start)session.last=Date.now()});document.addEventListener('keydown',()=>{if(session.start)session.last=Date.now()});
setInterval(()=>{if(!busy&&sessionExpired()){endSession();render()}},1000);
seed();

</script></body></html>
