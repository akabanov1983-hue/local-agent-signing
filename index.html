<script>
'use strict';
const assets=JSON.parse(document.getElementById('assets').textContent),sources=JSON.parse(document.getElementById('sources').textContent);
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=name=>assets[name]?`<img class="icon" src="${assets[name]}" alt="">`:'';
const btn=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${/^<img[^>]*>$/.test(label)?'aria-label="'+({'file':'Открыть действия с файлом','resend':'Повторить отправку','logs':'Открыть папку журналов','choose-avest':'Выбрать утилиту подписания','choose-download':'Выбрать папку загрузки'}[action.split(':')[0]]||'Действие')+'"':''} ${disabled?'disabled':''}>${label}</button>`;
const stateNames={READY_FOR_DOWNLOAD:'К загрузке',DOWNLOADING:'Загрузка',READY_FOR_SIGNING:'К подписанию',SIGNED:'Подписан',PARTIALLY_SIGNED:'Подписан частично',DECLINED:'Отклонен',EXPIRED:'Просрочен',DOWNLOAD_ERROR:'Ошибка загрузки',SIGN_ERROR:'Ошибка подписания',SIGN_CANCELLED:'Отмена пользователем',SENT:'Отправлен',SEND_ERROR:'Ошибка отправки'};
const description={READY_FOR_SIGNING:'Все файлы скачаны, ни один не подписан',SIGNED:'Все файлы подписаны',PARTIALLY_SIGNED:'Подписаны не все файлы',DECLINED:'Пользователь отклонил подписание',DOWNLOAD_ERROR:'Ошибка создания структуры или скачивания файлов',SIGN_ERROR:'Ошибка подписания или отправки файлов',SIGN_CANCELLED:'Пользователь отменил подписание'};
const statusLabel=(label,tone)=>`<span class="status ${esc(tone)}">${esc(label)}</span>`;
const status=s=>statusLabel(stateNames[s]||s,['SIGNED','SENT'].includes(s)?'good':s.endsWith('ERROR')?'error':s==='READY_FOR_SIGNING'?'ready':'warning');
const certs=[{id:'cert1',name:'Демонстрационный пользователь',org:'Тестовая организация',serial:'DEMO-01-2026',issuer:'УЦ Банка (демо)',from:'01.10.2026',until:'01.10.2027',valid:true},{id:'cert2',name:'Демонстрационный пользователь',org:'Тестовая организация',serial:'DEMO-02-2025',issuer:'НЦЭУ (демо)',from:'01.09.2025',until:'01.09.2026',valid:false}];
let tasks=[],page='tasks',opened=null,fileSelection=new Set(),selectedTasks=new Set(),selectedCert=null,noticeTimer,dialogResolve=null,dialogDismissible=true,busy=false;
const initialSettings={avest:'C:\\Program Files\\Avest\\AvCmUt4\\AvCmUt4.exe',download:'C:\\Users\\demo.user\\Downloads',archive:3,remove:15};let settings={...initialSettings};
// Проектное дополнение прототипа. Все записи относятся только к демонстрационным данным.
const journalKinds={received:'Получение задачи',download:'Загрузка файла',sign:'Формирование P7S',send:'Передача P7S',archive:'Перенос в архив',decline:'Отклонение задачи',delete:'Удаление из архива',certificate:'Выбор сертификата',settings:'Сохранение настроек',refresh:'Обновление списка'};
const journalResults={success:'Успешно',error:'Ошибка',cancel:'Отменено',none:'—'};
const journalEmptyFilters=()=>({query:'',kind:'',result:'',source:'',from:'',to:''});
let operationLog=[],journalSequence=0,journalFilters=journalEmptyFilters(),journalNewestFirst=true;
function journalTimestamp(value){
 if(!value)return new Date().toISOString();
 if(/^\d{2}\.\d{2}\.\d{4}/.test(value)){const [day,month,year,hour,minute]=value.match(/\d+/g);return new Date(`${year}-${month}-${day}T${hour}:${minute}:00+03:00`).toISOString()}
 return new Date(value).toISOString();
}
function journalDateLabel(value){return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(value)).replace(',','')}
function addOperation({kind,result='none',task=null,file=null,message='',details='',at=null}){
 const entry={id:'LOG-'+String(++journalSequence).padStart(4,'0'),at:journalTimestamp(at),kind,result,taskId:task?.id||'',taskName:task?.name||'',source:task?.system||'',fileId:file?.id||'',fileName:file?.name||'',message,details};
 operationLog.push(entry);return entry;
}
function seedJournal(){
 operationLog=[];journalSequence=0;journalFilters=journalEmptyFilters();journalNewestFirst=true;
 for(const t of tasks){
  const start=new Date(journalTimestamp(t.received||t.date)).getTime(),at=seconds=>new Date(start+seconds*1000).toISOString();
  addOperation({kind:'received',result:'success',task:t,message:'Получен комплект документов для подписания',details:'В задаче файлов: '+t.files.length,at:at(0)});
  t.files.forEach((f,i)=>{
   const failed=f.status==='DOWNLOAD_ERROR';
   addOperation({kind:'download',result:failed?'error':'success',task:t,file:f,message:failed?(f.error||'Файл не загружен'):'Исходный файл получен и сохранён',details:failed?'Задача доступна для просмотра результатов загрузки.':'Файл доступен в карточке задачи.',at:at(8+i)});
   if(['SENT','SEND_ERROR','SIGNED'].includes(f.status)){
    addOperation({kind:'sign',result:'success',task:t,file:f,message:'Сформирован отдельный P7S',at:at(35+i)});
    if(f.status!=='SIGNED')addOperation({kind:'send',result:f.status==='SENT'?'success':'error',task:t,file:f,message:f.status==='SENT'?'Получено подтверждение передачи P7S':(f.error||'P7S не передан'),at:at(45+i)});
   }
  });
  if(t.status==='SIGN_CANCELLED')addOperation({kind:'sign',result:'cancel',task:t,message:'Пользователь отменил подписание',at:at(35)});
  if(t.status==='DECLINED')addOperation({kind:'decline',result:'success',task:t,message:'Пользователь отклонил задачу',at:t.completed||at(60)});
  if(!t.active)addOperation({kind:'archive',result:'success',task:t,message:'Карточка и результаты доступны в архиве',at:t.completed||at(60)});
 }
}
function journalRangeError(){return journalFilters.from&&journalFilters.to&&journalFilters.from>journalFilters.to?'Начало периода не может быть позже его окончания.':''}
function filteredOperations(){
 if(journalRangeError())return [];
 const query=journalFilters.query.trim().toLocaleLowerCase('ru-RU');
 const from=journalFilters.from?new Date(journalFilters.from+'T00:00:00+03:00').getTime():-Infinity;
 const to=journalFilters.to?new Date(journalFilters.to+'T23:59:59.999+03:00').getTime():Infinity;
 return operationLog.filter(e=>{
  const time=new Date(e.at).getTime();
  return (!journalFilters.kind||e.kind===journalFilters.kind)&&(!journalFilters.result||e.result===journalFilters.result)&&(!journalFilters.source||e.source===journalFilters.source)&&time>=from&&time<=to&&(!query||[e.taskId,e.taskName,e.fileName,e.message,e.details,journalKinds[e.kind],journalResults[e.result]].join(' ').toLocaleLowerCase('ru-RU').includes(query));
 }).sort((a,b)=>(journalNewestFirst?-1:1)*(a.at.localeCompare(b.at)||a.id.localeCompare(b.id)));
}
function journalResultBadge(result){return result==='none'?'<span class="journal-muted">—</span>':statusLabel(journalResults[result]||result,{success:'good',error:'error',cancel:'warning'}[result]||'')}
function journalOptions(values,selected){return Object.entries(values).map(([key,value])=>`<option value="${esc(key)}" ${selected===key?'selected':''}>${esc(value)}</option>`).join('')}
function journalRows(){

async function signing(queue,selection=null){
 if(!queue.length)return info('Подписание','Выберите хотя бы один документ для подписания');
 if(selection&&selection.size===0)return info('Подписание','Выберите хотя бы один документ для подписания');
 if(selection&&selection.size<queue[0].files.length){if(!await confirmAction('Частичное подписание','Для подписания выбрана только часть файлов. Остальные файлы останутся неподписанными. Продолжить?'))return}
 if(!selectedCert){const yes=await showDialog('Выбор сертификата во внешнем Avest','<p>В настоящем приложении здесь используется внешний диалог Avest.</p><div class="demo-note">Окно Avest не содержится в репозитории. Для просмотра переходов доступно продолжение с демонстрационным сертификатом.</div>',[{label:'Отмена (Avest)',value:false},{label:'Продолжить демонстрацию',value:true,cls:'primary'}]);if(!yes){queue[0].status='SIGN_CANCELLED';queue[0].error='Подписание отменено пользователем';addOperation({kind:'sign',result:'cancel',task:queue[0],message:'Отменён выбор сертификата или ввод пароля'});render();return}}
 busy=true;const outcome=$('#outcome').value;let done=0,errors=0;
 for(const t of queue){
  const pending=selection?t.files.filter(f=>selection.has(f.id)):t.files;
  showDialog('Подписание...','<p>'+esc(t.name)+'</p><div class="progress"><i></i></div><pre>Имитация вызова Avest\nФайлов: '+pending.length+'\nПередача результата: демонстрационный режим</pre>',[],false);
  await new Promise(r=>setTimeout(r,900));dialogDismissible=true;closeDialog();
  if(outcome==='cancel'||outcome==='signerror'){t.status=outcome==='cancel'?'SIGN_CANCELLED':'SIGN_ERROR';t.error=outcome==='cancel'?'Подписание отменено пользователем':'Ошибка Avest (демонстрация)';addOperation({kind:'sign',result:outcome==='cancel'?'cancel':'error',task:t,message:t.error});errors++;break}
  pending.forEach(f=>{addOperation({kind:'sign',result:'success',task:t,file:f,message:'Сформирован отдельный P7S'});f.status=outcome==='senderror'?'SEND_ERROR':'SENT';f.error=outcome==='senderror'?'Ошибка при отправке, код: 503':'';addOperation({kind:'send',result:outcome==='senderror'?'error':'success',task:t,file:f,message:f.error||'Получено подтверждение передачи P7S'})});
  if(outcome==='senderror'){t.status='SIGN_ERROR';t.error='Ошибка отправки: ни один файл не был отправлен.';errors++}
  else{t.status=pending.length===t.files.length?'SIGNED':'PARTIALLY_SIGNED';t.active=false;t.completed='29.10.2026 15:00';t.error='';addOperation({kind:'archive',result:'success',task:t,message:'Задача перемещена в архив',details:'Итоговый статус: '+stateNames[t.status]});done++}
 }
 busy=false;opened=null;selectedTasks.clear();render();
 await info('Результат подписания',`Обработка завершена. Успешно: ${done}. С ошибкой или отменой: ${errors}. Действия выполнены только с демонстрационными данными.`);
}

async function dispatch(action){
 if(busy)return;const [kind,id]=action.split(':');
 if(kind==='journal-detail')await showJournalEntry(id);
 else if(kind==='journal-reset'){journalFilters=journalEmptyFilters();render()}
 else if(kind==='journal-refresh'){updateJournalResults();notify('Журнал обновлён')}
 else if(kind==='open'){opened=id;fileSelection=new Set(tasks.find(t=>t.id===id).files.map(f=>f.id));render()}
 else if(kind==='back'){opened=null;render()}
 else if(kind==='refresh'){selectedTasks.clear();addOperation({kind:'refresh',result:'success',message:page==='archive'?'Обновлён список архивных задач':'Обновлён список активных задач'});render();notify('Демонстрационный список обновлён')}
 else if(kind==='sign-selected'){const q=tasks.filter(t=>selectedTasks.has(t.id)&&t.active&&['READY_FOR_SIGNING','SIGN_CANCELLED','SIGN_ERROR'].includes(t.status));await signing(q)}
 else if(kind==='sign-card')await signing([tasks.find(t=>t.id===opened)],new Set(fileSelection));
 else if(kind==='decline'){if(await confirmAction('Отклонение задачи','Отклонить подписание выбранной задачи?','Отклонить')){const t=tasks.find(t=>t.id===id);t.status='DECLINED';t.error='Пользователь отклонил подписание';t.active=false;t.completed='29.10.2026 15:00';addOperation({kind:'decline',result:'success',task:t,message:'Пользователь отклонил задачу'});addOperation({kind:'archive',result:'success',task:t,message:'Отклонённая задача перемещена в архив'});opened=null;render()}}
 else if(kind==='delete')await remove([id]);
 else if(kind==='delete-selected')await remove([...selectedTasks]);
 else if(kind==='resend'){const t=tasks.find(t=>t.id===id);t.files.filter(f=>['SEND_ERROR','SIGNED'].includes(f.status)).forEach(f=>{f.status='SENT';f.error='';addOperation({kind:'send',result:'success',task:t,file:f,message:'Повторная передача P7S подтверждена'})});t.active=false;t.status='SIGNED';t.error='';t.completed='29.10.2026 15:00';addOperation({kind:'archive',result:'success',task:t,message:'Задача перемещена в архив после повторной отправки'});opened=null;render();notify('Имитация повторной отправки завершена')}
 else if(kind==='file')info('Действия с файлом','В установленном агенте файлы открываются и экспортируются средствами Windows. В этом прототипе реальные файлы не загружены.');
 else if(kind==='cert-use'){const c=certs.find(c=>c.id===id);if(!c.valid)return;const yes=await showDialog('Введите пароль к контейнеру','<input type="password" value="demonstration" disabled aria-label="Демонстрационный пароль"><div class="demo-note">Имитация ввода. Настоящий пароль не требуется и не сохраняется.</div>',[{label:'Отмена',value:false},{label:'Сохранить',value:true,cls:'primary'}]);if(yes){selectedCert=id;addOperation({kind:'certificate',result:'success',message:'Выбран сертификат для подписания',details:c.name+'. '+c.issuer});render();notify('Выбран демонстрационный сертификат')}}
 else if(kind==='cert-reset'){selectedCert=null;addOperation({kind:'certificate',result:'success',message:'Выбор сертификата сброшен'});render();notify('Выбор сертификата сброшен')}
 else if(kind==='cert-view'){const c=certs.find(c=>c.id===id);showDialog('Сведения о сертификате',`<p><b>${c.name}</b><br>УЦ: ${c.issuer}<br>Действителен с ${c.from} до ${c.until}<br>ID: ${c.serial}</p><div class="demo-note">В коде открывается системный просмотрщик Windows. Здесь показана иллюстрация с вымышленными данными.</div>`)}
 else if(kind==='logs')info('Каталог журналов','В приложении открывается папка журналов Windows. В браузерной демонстрации доступ к папке не выполняется.');
 else if(kind==='choose-avest'||kind==='choose-download')info('Выбор пути','В приложении открывается системный диалог выбора. Для демонстрации можно изменить путь прямо в поле.');
}

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('#dialog-x').onclick=()=>closeDialog();$('#dialog').addEventListener('cancel',e=>{e.preventDefault();if(dialogDismissible)closeDialog()});
$('#avatar').src=assets.avatar;$('#update-certs').innerHTML=`<img class="icon" src="${assets.update}" alt="">`;
$('#about').onclick=about;$('#version').onclick=()=>info('Версия','Показан снимок исходного кода cfd9658b от 29.10.2026. Номер установленной версии приложения по прототипу не определяется.');
$('#update-certs').onclick=()=>info('Обновление','В приложении запускается внешняя команда обновления СОС и сертификатов УЦ. Здесь действие имитируется.');
$('#toggle-demo').onclick=()=>{const hidden=$('#demo-controls').hidden;$('#demo-controls').hidden=!hidden;$('#toggle-demo').setAttribute('aria-expanded',String(hidden))};
$('#dataset').onchange=e=>seed(e.target.value);$('#reset').onclick=()=>{seed($('#dataset').value);notify('Исходный демонстрационный набор восстановлен')};
seed();
</script></body></html>
